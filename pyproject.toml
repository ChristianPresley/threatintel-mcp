[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "threatintel-mcp"
version = "0.1.0"
description = "An MCP server that wraps threat-intelligence lookup APIs (urlscan.io, VirusTotal) for indicator pivoting during investigations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Christian Presley" }]
keywords = ["mcp", "threat-intelligence", "virustotal", "urlscan", "security", "dfir"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.6.0",
]

[project.scripts]
threatintel-mcp = "threatintel_mcp.server:main"

[project.urls]
Homepage = "https://github.com/ChristianPresley/threatintel-mcp"
Repository = "https://github.com/ChristianPresley/threatintel-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/threatintel_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, bugbear, pyupgrade
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]  # line length handled by formatter; long docstrings are intentional
